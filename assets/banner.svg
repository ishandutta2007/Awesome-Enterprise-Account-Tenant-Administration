<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#primaryGrad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .node-orbit-1 {
      animation: orbit1 18s linear infinite;
      transform-origin: 980px 210px;
    }
    .node-orbit-2 {
      animation: orbit2 26s linear infinite;
      transform-origin: 980px 210px;
    }
    .pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .floating-card-1 {
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: floatSlowRev 7s ease-in-out infinite alternate;
    }

    @keyframes orbit1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbit2 {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(0.96); }
      100% { opacity: 0.75; transform: scale(1.04); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes floatSlowRev {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Glowing Background Orbs (Behind All Text) -->
  <circle class="pulse-glow" cx="980" cy="210" r="140" fill="#6366f1" filter="url(#glow)" />
  <circle class="pulse-glow" cx="200" cy="80" r="110" fill="#0284c7" filter="url(#glow)" />

  <!-- Dynamic Animated Architectural Orbit / Graph (Positioned cleanly to the right side) -->
  <g>
    <!-- Central Tenant Core -->
    <circle cx="980" cy="210" r="48" fill="#1e1b4b" stroke="#818cf8" stroke-width="3" filter="url(#subtleGlow)" />
    <!-- Tenant Shield / Core Icon -->
    <path d="M 980 188 L 998 196 L 998 214 C 998 226 990 236 980 240 C 970 236 962 226 962 214 L 962 196 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="980" cy="210" r="4" fill="#38bdf8" />

    <!-- Orbital Rings -->
    <circle cx="980" cy="210" r="105" fill="none" stroke="#334155" stroke-dasharray="6,8" stroke-width="1.5" />
    <circle cx="980" cy="210" r="160" fill="none" stroke="#1e293b" stroke-dasharray="8,10" stroke-width="1.5" />

    <!-- Orbiting Tenant Nodes (Layer 1) -->
    <g class="node-orbit-1">
      <circle cx="980" cy="105" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="980" cy="315" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle cx="875" cy="210" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
      <circle cx="1085" cy="210" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    </g>

    <!-- Orbiting Tenant Nodes (Layer 2 Outer) -->
    <g class="node-orbit-2">
      <circle cx="980" cy="50" r="11" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" />
      <circle cx="980" cy="370" r="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="820" cy="210" r="11" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
      <circle cx="1140" cy="210" r="11" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" />
    </g>
  </g>

  <!-- Left Side: Main Titles & Badges (Always in crisp foreground) -->
  <g transform="translate(60, 0)">
    <!-- Top Category Pill -->
    <g class="floating-card-1" transform="translate(0, 62)">
      <rect width="360" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" />
      <text x="32" y="22" class="badge-label">ENTERPRISE IAM • MULTI-TENANCY • IGA</text>
    </g>

    <!-- Main Title Lines -->
    <text x="0" y="148" class="title-text">Enterprise Account &amp;</text>
    <text x="0" y="202" class="title-text">Tenant Administration</text>

    <!-- Subtitle Line -->
    <text x="0" y="248" class="subtitle-text">Curated Architectures, Cloud IAM Platforms &amp; Self-Hosted IGA</text>

    <!-- Lower Pill Tags / Highlights -->
    <g class="floating-card-2" transform="translate(0, 285)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🏢 Multi-Tenant IAM</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(190, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔄 Directory Sync</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(385, 0)">
        <rect width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛡️ Self-Hosted IGA</text>
      </g>
    </g>

    <!-- Bottom Metrics Line -->
    <text x="0" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      ✓ Real-time Pricing Models &nbsp;|&nbsp; ✓ 15+ Open-Source Projects &nbsp;|&nbsp; ✓ Zero-Trust Architecture
    </text>
  </g>
</svg>
